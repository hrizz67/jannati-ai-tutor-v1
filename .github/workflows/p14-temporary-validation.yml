name: P1.4 temporary full validation

on:
  push:
    branches:
      - fix/mobile-speech-idle-tts-cancel

permissions:
  contents: read

concurrency:
  group: p14-full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Targeted, full, validation, and build gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder

    steps:
      - name: Checkout implementation commit
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run targeted speech diagnostics tests
        run: npx vitest run tests/unit/speechDiagnostics.test.js

      - name: Run full unit suite
        run: npm test

      - name: Run exhaustive validation gates
        run: npm run prevalidate

      - name: Run master validation summary
        run: npm run validate

      - name: Verify release metadata
        run: npm run release:check

      - name: Build production application and enforce bundle budget
        run: npm run build

      - name: Verify build structure and credential safety
        run: npm run build:structure-check

      - name: Verify production build assets
        run: npm run release:build-check
