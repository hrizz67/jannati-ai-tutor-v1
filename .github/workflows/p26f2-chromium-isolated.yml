name: P2.6-F2 isolated Chromium Tutor accessibility

on:
  push:
    branches:
      - qa/p26f2-chromium-synthetic-accessibility
      - fix/p26f2-short-viewport-chat-layout
      - qa/p26f3-exact-css-viewport-reflow
      - qa/p26f4-assistive-device-readiness

permissions:
  contents: read

concurrency:
  group: p26f2-chromium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-chromium:
    name: Synthetic Chromium accessibility, NO production login
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7

      - name: Use Node 24 with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify local Chrome binary
        shell: bash
        run: |
          if command -v google-chrome-stable >/dev/null; then
            google-chrome-stable --version
          elif command -v google-chrome >/dev/null; then
            google-chrome --version
          elif command -v chromium >/dev/null; then
            chromium --version
          else
            echo "CHROME_NOT_INSTALLED: explicit infrastructure BLOCKED" >&2
            exit 1
          fi

      - name: Serve isolated synthetic fixture without any backend configuration
        shell: bash
        run: |
          env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY \
            -u VITE_STT_ENDPOINT -u VITE_QUIZ_STT_ENDPOINT \
            npm run dev -- --mode qa-preview --host 127.0.0.1 --port 4173 --strictPort \
            > /tmp/p26f2-vite.log 2>&1 &
          echo $! > /tmp/p26f2-vite.pid
          for step in $(seq 1 40); do
            if curl -fsS --max-time 2 \
              "http://127.0.0.1:4173/jannati-ai-tutor-v1/tests/browser/tutor-accessibility-chrome.html" \
              > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p26f2-vite.log
          exit 1

      - name: Real Chromium render, keyboard and geometry at 320 / 390 / 1280
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)
          URL="http://127.0.0.1:4173/jannati-ai-tutor-v1/tests/browser/tutor-accessibility-chrome.html"
          for size in "320,640" "390,844" "1280,800"; do
            name="${size/,/x}"
            tempdir=$(mktemp -d)
            echo "Checking Chromium viewport ${name}"
            timeout 40s "$CHROME" \
              --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-extensions --disable-background-networking --disable-sync \
              --no-first-run --no-default-browser-check \
              --user-data-dir="$tempdir" --window-size="$size" \
              --virtual-time-budget=11000 --dump-dom "$URL" \
              > "/tmp/p26f2-${name}.html" 2> "/tmp/p26f2-${name}.err" || {
                tail -70 "/tmp/p26f2-${name}.err"
                exit 1
              }
            if ! grep -q 'CHROMIUM_TUTOR_QA_PASS' "/tmp/p26f2-${name}.html"; then
              echo "CHROMIUM_BROWSE_NO_GO (${name})"
              grep -o 'CHROMIUM_TUTOR_QA_\(PASS\|FAIL\|PENDING\)[^<]*' \
                "/tmp/p26f2-${name}.html" | head -20 || true
              tail -60 "/tmp/p26f2-${name}.err"
              exit 1
            fi
            grep -o 'CHROMIUM_TUTOR_QA_PASS[^<]*' "/tmp/p26f2-${name}.html" | head -1
            rm -rf "$tempdir"
          done

      - name: CDP-exact CSS viewport and text reflow checks
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)" \
            node scripts/validate/p26f3ChromiumViewport.mjs

      - name: Preserve synthetic-only browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p26f2-chromium-synthetic-${{ github.sha }}
          path: |
            /tmp/p26f2-*.html
            /tmp/p26f2-*.err
            /tmp/p26f2-vite.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop local development server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p26f2-vite.pid; then
            kill "$(cat /tmp/p26f2-vite.pid)" 2>/dev/null || true
          fi
