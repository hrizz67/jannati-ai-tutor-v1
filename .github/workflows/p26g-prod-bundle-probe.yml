name: P2.6-G exact production bundle 900k gate (NO DEPLOY)

on:
  push:
    branches:
      - fix/p26g-defer-serviceworker-init

permissions:
  contents: read

concurrency:
  group: p26g-production-bundle
  cancel-in-progress: true

jobs:
  true-production-bundle:
    name: Verify exact STT-enabled production payload without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Exact tagged-release production build configuration and strict budget
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TUTOR_AI_REMOTE_ENABLED: 'false'
          VITE_STT_ENDPOINT: https://jannati-ai-tutor-stt.jannati-ai-tutor-stt-hrizz67.workers.dev/v1/transcribe
          VITE_QUIZ_STT_ENDPOINT: https://jannati-ai-tutor-quiz-stt.jannati-ai-tutor-stt-hrizz67.workers.dev/v1/quiz/transcribe
          VITE_QUIZ_MOBILE_STT_PILOT_ENABLED: 'true'
          VITE_QUIZ_MOBILE_STT_AUTO_ENABLED: 'false'
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
          npm run release:build-check
          echo "PRODUCTION_EXACT_BUNDLE_PASS ${GITHUB_SHA}"

      - name: Confirm this workflow never deploys
        run: |
          echo "NO_DEPLOY: no git tag, GitHub Pages publish, external Worker, database or release mutation."
